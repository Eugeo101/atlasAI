# Day 9: added the vLLM scrape job. vLLM ships a Prometheus-format
# /metrics endpoint out of the box (TTFT/TPOT/e2e-latency histograms,
# token throughput, queue depth) — this is where Day 10's p95 numbers
# actually come from. The k6 script only generates the traffic.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # "vllm" is the compose SERVICE NAME — Prometheus reaches it over the
  # internal compose network (not localhost, which inside this container
  # is Prometheus itself). Default metrics_path /metrics is correct.
  - job_name: "vllm"
    scheme: https
    static_configs:
      - targets: ["eagle-introduce-monster-vatican.trycloudflare.com:443"]
